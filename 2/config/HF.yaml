# High-fidelity (HF) model: fine mesh, dt = 0.01
# Paper Sec. 5.1: Delta t_HF = 0.01, fine mesh (Fig. 6b: 16478 elements, 8239 nodes),
# N_HF^mu = 10 Reynolds numbers uniformly spaced in [70, 160].

name: HF

mesh:
  geo: mesh/cylinder.geo          # parametrised Gmsh geometry (shared by LF/HF)
  file: mesh/HF_fine.msh          # generated by generate_meshes.m
  s1: 0.015                       # element size on the channel walls / inlet / outlet
  s3: 0.002                       # element size on the cylinder
  algorithm: 5                    # Gmsh 2D algorithm (5 = Delaunay)

physics:
  rho: 1.0
  D: 0.1                          # cylinder diameter 2r
  U_max: 1.5                      # max inflow velocity, U_mean = 2/3 U_max = 1
  H: 0.41

fem: [P2, P1]                     # Taylor-Hood elements

time:
  t0: 0.0
  tf: 15.0
  dt: 0.01
  BDF_order: 2
  nonlinearity: implicit          # Newton iterations at every time step

newton:
  tol: 1.0e-8
  maxit: 30

reynolds:
  min: 70
  max: 160
  n: 10                           # Re = linspace(70, 160, 10) = 70:10:160

sampling:                         # dataset: uniform samples on the periodic regime
  t_start: 14.5
  t_end: 15.0
  n_t: 26

output:
  dir: results/HF                 # one sub-folder per Reynolds number
  dataset: results/dataset_HF     # .mat and .csv are written
  save_snapshots: false           # store (u_x, u_y, p) for t >= t_start
  verbose: false                  # one log line per time step

checkpoint:
  every_steps: 50                 # write the solver state every 50 time steps (0.5 s)
